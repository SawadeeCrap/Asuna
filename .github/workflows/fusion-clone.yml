# Builds the Fusion Clone VCV Rack plugin, loads it into a real Rack, and runs its DSP test suite on Apple silicon (macos-14) and Linux.
#
#   * "Plugin" jobs build against the official Rack SDK and upload a ready-to-install .vcvplugin as a workflow artifact:
#       Actions -> the run -> Artifacts -> FusionClone-mac-arm64 -> unzip -> double-click the .vcvplugin (or drop it into
#       ~/Library/Application Support/Rack2/plugins-mac-arm64/ after unzipping the archive there).
#     The package is then unpacked again and inspected (architecture, linked libraries, exported symbols); a failed inspection fails the job.
#     The same files can also be committed into the branch (fusion-clone/downloads/, one click to download on github.com): push a commit whose
#     message contains [package], or start the workflow by hand with "publish" ticked. (Careful: GitHub skips the whole run when a commit message
#     contains the words "skip" and "ci" in square brackets anywhere, even when only quoted.)
#   * "Load in Rack" jobs (experimental, do not fail the run) install Rack Free, put the package into a scratch user folder and run a patch
#     headless for a while (tests/rack_smoke.sh): proves that a real Rack loads the plugin, creates the module and survives the engine
#     (the module reports on shutdown that it locked onto the VCO). "Rack with its window" (Linux only) starts Rack with a window on a virtual
#     display and takes a screenshot (tests/rack_gui_shot.sh), which exercises the drawing code of the panel.
#   * "DSP tests" run tests/ (portable code, pffft as FFT backend) twice - once with plain -O2 and once with the optimisation flags the plugin
#     itself is built with (Rack's -O3 -funsafe-math-optimizations -march=...) - and, on Apple silicon, the CPU benchmark (numbers are those of a
#     shared GitHub VM, informative only).
#   * "Soak" jobs push minutes of audio through the engine (steady / sequenced / knob-twiddling / random-note / hardware-like / chaos inputs) and check
#     the invariants that only a long run can break; "Sanitizers" runs the chaos input and the tracker / dynamics tests under AddressSanitizer and
#     UndefinedBehaviorSanitizer (float -> int conversions and float divisions by zero included) on Apple silicon and on Linux.
#
# The SDK is downloaded from vcvrack.com (RACK_SDK_VERSION = "latest" or e.g. "2.5.2"; pick the version that matches your Rack).
name: fusion-clone

on:
  push:
    branches: [claude/jolly-einstein-e9h02j, main]
    # documentation and screenshots do not need a rebuild (README.md is packaged, but only as a text file)
    paths: ['fusion-clone/**', '!fusion-clone/docs/**', '!fusion-clone/README.md', '.github/workflows/fusion-clone.yml', '.github/actions/**']
  workflow_dispatch:
    inputs:
      rack_sdk_version:
        description: 'Rack SDK version (latest, or e.g. 2.5.2)'
        default: 'latest'
      publish:
        description: 'Also commit the built packages into fusion-clone/downloads/ of the branch'
        type: boolean
        default: false

env:
  RACK_SDK_VERSION: ${{ github.event.inputs.rack_sdk_version || 'latest' }}

jobs:
  plugin:
    name: Plugin (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: mac-arm64, os: macos-14}
          - {platform: lin-x64, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rack SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.zip" "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.platform }}.zip"
          unzip -q -o "$RUNNER_TEMP/sdk.zip" -d "$HOME"
          ls "$HOME/Rack-SDK" | head -20
          echo "--- first headings of the SDK's changelog (the newest version comes first):"
          grep -m6 -Eo '<h[1-6][^>]*>[^<]*' "$HOME/Rack-SDK/CHANGELOG.html" || true
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew list zstd >/dev/null 2>&1 || brew install zstd
      - name: Build
        working-directory: fusion-clone
        run: make -j3 RACK_DIR="$HOME/Rack-SDK" dist
      - uses: actions/upload-artifact@v4
        with:
          name: FusionClone-${{ matrix.platform }}
          path: fusion-clone/dist/*.vcvplugin
          if-no-files-found: error
      - name: Inspect the package
        working-directory: fusion-clone
        run: |
          ls -l dist
          pkg=$(ls dist/*.vcvplugin)
          mkdir -p "$RUNNER_TEMP/pkg"
          zstd -dc "$pkg" | tar -x -C "$RUNNER_TEMP/pkg"
          find "$RUNNER_TEMP/pkg" -type f | sort
          bin=$(ls "$RUNNER_TEMP"/pkg/FusionClone/plugin.so "$RUNNER_TEMP"/pkg/FusionClone/plugin.dylib 2>/dev/null | head -n1)
          echo "binary: $bin"
          file "$bin"
          if [ "$RUNNER_OS" = macOS ]; then
            lipo -info "$bin"
            otool -L "$bin"
            codesign -dv "$bin" 2>&1 || true
            nm -gU "$bin" | grep -E ' _init$'                    # the entry point Rack looks up
            nm -gU "$bin" | grep -E ' _modelFusionClone$'
            exports=$(nm -gU "$HOME/Rack-SDK/libRack.dylib" | awk '{print $NF}')
            wanted=$(nm -u "$bin" | awk '{print $NF}' | grep -E '^_pffft_' || true)
          else
            ldd "$bin" || true
            nm -D --defined-only "$bin" | grep -E ' T init$'
            nm -D --defined-only "$bin" | grep -E ' modelFusionClone$'
            exports=$(nm -D --defined-only "$HOME/Rack-SDK/libRack.so" | awk '{print $NF}')
            wanted=$(nm -D -u "$bin" | awk '{print $NF}' | grep -E '^pffft_' || true)      # the .so is stripped: only its dynamic symbols exist
          fi
          # every pffft function the plugin calls must be exported by Rack (otherwise the first FFT would abort Rack at run time)
          test -n "$wanted"
          for s in $wanted; do
            if echo "$exports" | grep -qx "$s"; then echo "  Rack exports $s"; else echo "  MISSING in libRack: $s"; exit 1; fi
          done

  rack-smoke:
    name: Load in Rack (${{ matrix.platform }})
    needs: plugin
    if: ${{ !cancelled() }}      # run even when an inspection step of another platform failed; the artifact download decides
    continue-on-error: true      # experimental: depends on Rack's headless mode and on the download names at vcvrack.com
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: mac-arm64, os: macos-14}
          - {platform: lin-x64, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FusionClone-${{ matrix.platform }}
          path: pkg
      - uses: ./.github/actions/install-rack-free
      - name: Load the package in Rack and run a patch (headless, 20 s)
        run: bash fusion-clone/tests/rack_smoke.sh pkg/*.vcvplugin "$RACK_BIN" 20

  rack-gui:
    name: Rack with its window (${{ matrix.platform }})
    needs: plugin
    if: ${{ !cancelled() }}
    continue-on-error: true      # experimental: needs OpenGL (Mesa software rendering on a virtual X display)
    timeout-minutes: 15
    permissions:
      contents: write            # only to commit the screenshot when the pushed commit message contains [shots]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only: the macOS runner VMs cannot give Rack an OpenGL 2 context ("Could not open GLFW window"), so a window test is impossible there
          - {platform: lin-x64, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the screenshot step rebases onto the branch tip before it pushes
      - uses: actions/download-artifact@v4
        with:
          name: FusionClone-${{ matrix.platform }}
          path: pkg
      - uses: ./.github/actions/install-rack-free
      - name: Load the package in Rack with its window, take a screenshot
        run: RACK_SHOT_OUT="$PWD/shots" bash fusion-clone/tests/rack_gui_shot.sh pkg/*.vcvplugin "$RACK_BIN" 15 1.0
      - name: Commit the screenshot to the branch (only for pushes whose commit message contains [shots])
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]')
        run: |
          ls -l shots || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p fusion-clone/docs/figures/rack
          cp shots/*.png fusion-clone/docs/figures/rack/
          git add fusion-clone/docs/figures/rack
          git commit -m "CI: screenshot of Fusion Clone in Rack 2.6.6 (${{ matrix.platform }}) [skip ci]" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 3))
          done

  publish-package:
    name: Commit the built packages into the branch (only for pushes whose commit message contains [package], or a manual run with "publish")
    needs: plugin
    if: ${{ !cancelled() && needs.plugin.result == 'success' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[package]')) || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write            # to push the packages; the only job of this workflow besides the screenshot step that can write to the repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the commit step rebases onto the branch tip before it pushes
      - uses: actions/download-artifact@v4
        with:
          path: pkgs                 # every artifact of this run, each in a folder of its own name
      - name: Commit fusion-clone/downloads/*.vcvplugin
        run: |
          find pkgs -type f | sort
          mkdir -p fusion-clone/downloads
          cp pkgs/FusionClone-*/*.vcvplugin fusion-clone/downloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fusion-clone/downloads          # *.vcvplugin is in .gitignore; these are the files meant to be downloaded
          git commit -m "CI: built packages of ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 3))
          done

  dsp-tests:
    name: DSP tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, march: '-march=armv8-a+fp+simd'}
          - {os: ubuntu-latest, march: '-march=nehalem'}
    runs-on: ${{ matrix.os }}
    env:
      # what Rack's compile.mk builds the plugin with (the plugin itself adds -Wall -Wextra and its own defines)
      PLUGIN_OPT: -std=c++11 -O3 -funsafe-math-optimizations -fno-omit-frame-pointer ${{ matrix.march }} -Wall -Wextra -Wno-unused-parameter
    steps:
      - uses: actions/checkout@v4
      - name: pffft (FFT backend of the plugin)
        run: git clone --depth 1 https://github.com/marton78/pffft.git "$RUNNER_TEMP/pffft"
      - name: DSP tests (-O2)
        working-directory: fusion-clone/tests
        run: make -j3 PFFFT="$RUNNER_TEMP/pffft" all
      - name: DSP tests (the plugin's optimisation flags)
        working-directory: fusion-clone/tests
        run: |
          make clean
          CXXFLAGS="$PLUGIN_OPT" make -j3 PFFFT="$RUNNER_TEMP/pffft" all
      - name: CPU benchmark (Apple silicon only)
        if: runner.os == 'macOS'
        working-directory: fusion-clone/tools
        run: |
          CXXFLAGS="$PLUGIN_OPT" make PFFFT="$RUNNER_TEMP/pffft" bench
          { echo '## CPU benchmark on '"$(sysctl -n machdep.cpu.brand_string) ($(sysctl -n hw.ncpu) cores, shared GitHub VM), flags: $PLUGIN_OPT"; echo; ./bench 4 md; } | tee -a "$GITHUB_STEP_SUMMARY"

  soak:
    name: Soak test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, march: '-march=armv8-a+fp+simd'}
          - {os: ubuntu-latest, march: '-march=nehalem'}
    runs-on: ${{ matrix.os }}
    continue-on-error: true      # informational until it has proven stable; a failure is a real finding, read its log
    timeout-minutes: 60
    env:
      PLUGIN_OPT: -std=c++11 -O3 -funsafe-math-optimizations -fno-omit-frame-pointer ${{ matrix.march }} -Wall -Wextra -Wno-unused-parameter
    steps:
      - uses: actions/checkout@v4
      - name: pffft (FFT backend of the plugin)
        run: git clone --depth 1 https://github.com/marton78/pffft.git "$RUNNER_TEMP/pffft"
      - name: Build the soak test with the plugin's flags
        working-directory: fusion-clone/tests
        run: CXXFLAGS="$PLUGIN_OPT" make PFFFT="$RUNNER_TEMP/pffft" test_soak
      - name: Minutes of audio through the engine (six runs in parallel)
        working-directory: fusion-clone/tests
        run: |
          run() { name=$1; shift; ./test_soak "$@" > "soak_$name.txt" 2>&1; echo "$name: exit status $?" > "soak_$name.status"; }
          run steady48 12 48000 steady 3 16 &
          run steady44 12 44100 steady 3 16 &
          run steady96 6 96000 steady 3 16 &
          run seq48 12 48000 seq 3 16 &
          run knobs48 12 48000 knobs 3 16 &
          run notes48 12 48000 notes 3 16 &
          wait
          cat soak_*.status
          for f in soak_*.txt; do echo "===== $f"; grep -E "minute|FAIL|t=|PASSED|FAILED" "$f" | tail -30; done
          if grep -l "FAILED" soak_*.txt; then exit 1; fi

  soak-hw:
    name: Soak test, hardware-like and chaos inputs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, march: '-march=armv8-a+fp+simd'}
          - {os: ubuntu-latest, march: '-march=nehalem'}
    runs-on: ${{ matrix.os }}
    continue-on-error: true      # informational until it has proven stable; a failure is a real finding, read its log
    timeout-minutes: 60
    env:
      PLUGIN_OPT: -std=c++11 -O3 -funsafe-math-optimizations -fno-omit-frame-pointer ${{ matrix.march }} -Wall -Wextra -Wno-unused-parameter
    steps:
      - uses: actions/checkout@v4
      - name: pffft (FFT backend of the plugin)
        run: git clone --depth 1 https://github.com/marton78/pffft.git "$RUNNER_TEMP/pffft"
      - name: Build the soak test with the plugin's flags
        working-directory: fusion-clone/tests
        run: CXXFLAGS="$PLUGIN_OPT" make PFFFT="$RUNNER_TEMP/pffft" test_soak
      - name: Minutes of hardware-like notes and of hostile input through the engine (four runs in parallel)
        working-directory: fusion-clone/tests
        run: |
          run() { name=$1; shift; ./test_soak "$@" > "soak_$name.txt" 2>&1; echo "$name: exit status $?" > "soak_$name.status"; }
          run hw48 13 48000 hw 3 16 &
          run hw44 13 44100 hw 2 16 &
          SOAK_SEED=2 run chaos48 12 48000 chaos 3 16 &
          SOAK_SEED=3 run chaos96 6 96000 chaos 1 16 &
          wait
          cat soak_*.status
          for f in soak_*.txt; do echo "===== $f"; grep -E "minute|FAIL|t=|PASSED|FAILED" "$f" | tail -30; done
          if grep -l "FAILED" soak_*.txt; then exit 1; fi

  sanitizers:
    name: Sanitizers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true      # informational until it has proven stable; a report is a real finding, read its log
    timeout-minutes: 60
    env:
      # float-cast-overflow: a NaN / huge float converted to an int is undefined and differs between x86 (INT_MIN) and Apple silicon (0 / INT_MAX)
      SAN: -fsanitize=address,undefined,float-cast-overflow,float-divide-by-zero -fno-sanitize-recover=all -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4
      - name: pffft (FFT backend of the plugin)
        run: git clone --depth 1 https://github.com/marton78/pffft.git "$RUNNER_TEMP/pffft"
      - name: Build the tests with the sanitizers
        working-directory: fusion-clone/tests
        run: CXXFLAGS="-std=c++11 -O1 -g $SAN -pthread -Wall -Wextra -Wno-unused-parameter" make -j3 PFFFT="$RUNNER_TEMP/pffft" test_soak test_dynamics test_analyzer
      - name: Unit tests under the sanitizers
        working-directory: fusion-clone/tests
        run: |
          ./test_analyzer
          ./test_dynamics
      - name: Chaos input (all controls, hostile signals, NaN / Inf bursts) and hardware-like notes under the sanitizers
        if: ${{ !cancelled() }}      # even when a unit test above reported something
        working-directory: fusion-clone/tests
        run: |
          run() { name=$1; shift; ./test_soak "$@" > "san_$name.txt" 2>&1; echo "$name: exit status $?" > "san_$name.status"; }
          SOAK_SEED=1 run chaos1 5 48000 chaos 3 16 &
          SOAK_SEED=2 run chaos2 5 44100 chaos 1 16 &
          SOAK_SEED=3 run chaos3 4 96000 chaos 2 16 &
          run hw 4 48000 hw 3 16 &
          wait
          cat san_*.status
          for f in san_*.txt; do echo "===== $f"; grep -E "runtime error|ERROR: |SUMMARY|FAIL|t=|PASSED|FAILED" "$f" | tail -30; done
          if grep -lE "runtime error|ERROR: AddressSanitizer|FAILED" san_*.txt; then exit 1; fi
