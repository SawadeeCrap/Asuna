# Builds the Fusion Clone VCV Rack plugin and runs its DSP test suite on Apple silicon (macos-14) and Linux.
#
#   * "Plugin" jobs build against the official Rack SDK and upload a ready-to-install .vcvplugin as a workflow artifact:
#       Actions -> the run -> Artifacts -> FusionClone-mac-arm64 -> unzip -> double-click the .vcvplugin (or drop it into
#       ~/Library/Application Support/Rack2/plugins-mac-arm64/ after unzipping the archive there).
#   * "DSP tests" run tests/ (portable code, pffft as FFT backend) and, on Apple silicon, the CPU benchmark (numbers are those of a shared
#     GitHub VM, informative only).
#
# The SDK is downloaded from vcvrack.com (RACK_SDK_VERSION = "latest" or e.g. "2.5.2"; pick the version that matches your Rack).
name: fusion-clone

on:
  push:
    branches: [claude/jolly-einstein-e9h02j, main]
    paths: ['fusion-clone/**', '.github/workflows/fusion-clone.yml']
  workflow_dispatch:
    inputs:
      rack_sdk_version:
        description: 'Rack SDK version (latest, or e.g. 2.5.2)'
        default: 'latest'

env:
  RACK_SDK_VERSION: ${{ github.event.inputs.rack_sdk_version || 'latest' }}

jobs:
  plugin:
    name: Plugin (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: mac-arm64, os: macos-14}
          - {platform: lin-x64, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rack SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.zip" "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.platform }}.zip"
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$HOME"
          ls "$HOME/Rack-SDK" | head -20
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew list zstd >/dev/null 2>&1 || brew install zstd
      - name: Build
        working-directory: fusion-clone
        run: make -j3 RACK_DIR="$HOME/Rack-SDK" dist
      - name: Package listing
        working-directory: fusion-clone
        run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: FusionClone-${{ matrix.platform }}
          path: fusion-clone/dist/*.vcvplugin
          if-no-files-found: error

  dsp-tests:
    name: DSP tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: pffft (FFT backend of the plugin)
        run: git clone --depth 1 https://github.com/marton78/pffft.git "$RUNNER_TEMP/pffft"
      - name: DSP tests
        working-directory: fusion-clone/tests
        run: make -j3 PFFFT="$RUNNER_TEMP/pffft" all
      - name: CPU benchmark (Apple silicon only)
        if: runner.os == 'macOS'
        working-directory: fusion-clone/tools
        run: |
          make PFFFT="$RUNNER_TEMP/pffft" bench
          { echo '## CPU benchmark on '"$(sysctl -n machdep.cpu.brand_string) ($(sysctl -n hw.ncpu) cores, shared GitHub VM)"; echo; ./bench 4 md; } | tee -a "$GITHUB_STEP_SUMMARY"
