# Builds the Fusion Clone VCV Rack plugin, loads it into a real Rack, and runs its DSP test suite on Apple silicon (macos-14) and Linux.
#
#   * "Plugin" jobs build against the official Rack SDK and upload a ready-to-install .vcvplugin as a workflow artifact:
#       Actions -> the run -> Artifacts -> FusionClone-mac-arm64 -> unzip -> double-click the .vcvplugin (or drop it into
#       ~/Library/Application Support/Rack2/plugins-mac-arm64/ after unzipping the archive there).
#     The package is then unpacked again and inspected (architecture, linked libraries, exported symbols); a failed inspection fails the job.
#   * "Load in Rack" jobs (experimental, do not fail the run) install Rack Free, put the package into a scratch user folder and run a patch
#     headless for a while (tests/rack_smoke.sh): proves that a real Rack loads the plugin, creates the module and survives the engine.
#   * "DSP tests" run tests/ (portable code, pffft as FFT backend) twice - once with plain -O2 and once with the optimisation flags the plugin
#     itself is built with (Rack's -O3 -funsafe-math-optimizations -march=...) - and, on Apple silicon, the CPU benchmark (numbers are those of a
#     shared GitHub VM, informative only).
#
# The SDK is downloaded from vcvrack.com (RACK_SDK_VERSION = "latest" or e.g. "2.5.2"; pick the version that matches your Rack).
name: fusion-clone

on:
  push:
    branches: [claude/jolly-einstein-e9h02j, main]
    paths: ['fusion-clone/**', '.github/workflows/fusion-clone.yml']
  workflow_dispatch:
    inputs:
      rack_sdk_version:
        description: 'Rack SDK version (latest, or e.g. 2.5.2)'
        default: 'latest'

env:
  RACK_SDK_VERSION: ${{ github.event.inputs.rack_sdk_version || 'latest' }}

jobs:
  plugin:
    name: Plugin (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: mac-arm64, os: macos-14}
          - {platform: lin-x64, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rack SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.zip" "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.platform }}.zip"
          unzip -q -o "$RUNNER_TEMP/sdk.zip" -d "$HOME"
          ls "$HOME/Rack-SDK" | head -20
          echo "--- first headings of the SDK's changelog (the newest version comes first):"
          grep -m6 -Eo '<h[1-6][^>]*>[^<]*' "$HOME/Rack-SDK/CHANGELOG.html" || true
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew list zstd >/dev/null 2>&1 || brew install zstd
      - name: Build
        working-directory: fusion-clone
        run: make -j3 RACK_DIR="$HOME/Rack-SDK" dist
      - uses: actions/upload-artifact@v4
        with:
          name: FusionClone-${{ matrix.platform }}
          path: fusion-clone/dist/*.vcvplugin
          if-no-files-found: error
      - name: Inspect the package
        working-directory: fusion-clone
        run: |
          ls -l dist
          pkg=$(ls dist/*.vcvplugin)
          mkdir -p "$RUNNER_TEMP/pkg"
          zstd -dc "$pkg" | tar -x -C "$RUNNER_TEMP/pkg"
          find "$RUNNER_TEMP/pkg" -type f | sort
          bin=$(ls "$RUNNER_TEMP"/pkg/FusionClone/plugin.so "$RUNNER_TEMP"/pkg/FusionClone/plugin.dylib 2>/dev/null | head -n1)
          echo "binary: $bin"
          file "$bin"
          if [ "$RUNNER_OS" = macOS ]; then
            lipo -info "$bin"
            otool -L "$bin"
            codesign -dv "$bin" 2>&1 || true
            nm -gU "$bin" | grep -E ' _init$'                    # the entry point Rack looks up
            nm -gU "$bin" | grep -E ' _modelFusionClone$'
            exports=$(nm -gU "$HOME/Rack-SDK/libRack.dylib" | awk '{print $NF}')
            wanted=$(nm -u "$bin" | awk '{print $NF}' | grep -E '^_pffft_' || true)
          else
            ldd "$bin" || true
            nm -D --defined-only "$bin" | grep -E ' T init$'
            nm -D --defined-only "$bin" | grep -E ' modelFusionClone$'
            exports=$(nm -D --defined-only "$HOME/Rack-SDK/libRack.so" | awk '{print $NF}')
            wanted=$(nm -u "$bin" | awk '{print $NF}' | grep -E '^pffft_' || true)
          fi
          # every pffft function the plugin calls must be exported by Rack (otherwise the first FFT would abort Rack at run time)
          test -n "$wanted"
          for s in $wanted; do
            if echo "$exports" | grep -qx "$s"; then echo "  Rack exports $s"; else echo "  MISSING in libRack: $s"; exit 1; fi
          done

  rack-smoke:
    name: Load in Rack (${{ matrix.platform }})
    needs: plugin
    continue-on-error: true      # experimental: depends on Rack's headless mode and on the download names at vcvrack.com
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: mac-arm64, os: macos-14}
          - {platform: lin-x64, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FusionClone-${{ matrix.platform }}
          path: pkg
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew list zstd >/dev/null 2>&1 || brew install zstd
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd xvfb libasound2t64 libgl1 libglu1-mesa libgtk-3-0t64 libjack-jackd2-0 libpulse0 \
              || sudo apt-get install -y -qq zstd xvfb libasound2 libgl1 libglu1-mesa libgtk-3-0 libjack-jackd2-0 libpulse0 \
              || true
          fi
      - name: Rack Free
        run: |
          base=https://vcvrack.com/downloads
          if [ "$RUNNER_OS" = macOS ]; then
            names="RackFree-latest-mac-x64+arm64.pkg RackFree-2.6.6-mac-x64+arm64.pkg"
          else
            names="RackFree-latest-lin-x64.zip RackFree-2.6.6-lin-x64.zip"
          fi
          got=
          for n in $names; do
            dl="$RUNNER_TEMP/rackfree.${n##*.}"
            code=$(curl -sSL -o "$dl" -w '%{http_code}' "$base/$n") || code=curl-failed
            echo "$code  $base/$n"
            if [ "$code" = 200 ]; then got=$dl; break; fi
          done
          test -n "$got" || { echo "could not download Rack Free"; exit 1; }
          ls -l "$got"; file "$got"
          if [ "$RUNNER_OS" = macOS ]; then
            sudo installer -pkg "$got" -target /
            ls /Applications
            rack=$(find /Applications -maxdepth 5 -type f -name Rack -path '*MacOS*' | head -n1)
          else
            unzip -q -o "$got" -d "$HOME"
            ls "$HOME"
            rack=$(find "$HOME" -maxdepth 2 -type f -name Rack | head -n1)
          fi
          echo "Rack executable: $rack"
          test -x "$rack"
          echo "RACK_BIN=$rack" >> "$GITHUB_ENV"
      - name: Load the package in Rack and run a patch
        run: bash fusion-clone/tests/rack_smoke.sh pkg/*.vcvplugin "$RACK_BIN" 20

  dsp-tests:
    name: DSP tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, march: '-march=armv8-a+fp+simd'}
          - {os: ubuntu-latest, march: '-march=nehalem'}
    runs-on: ${{ matrix.os }}
    env:
      # what Rack's compile.mk builds the plugin with (the plugin itself adds -Wall -Wextra and its own defines)
      PLUGIN_OPT: -std=c++11 -O3 -funsafe-math-optimizations -fno-omit-frame-pointer ${{ matrix.march }} -Wall -Wextra -Wno-unused-parameter
    steps:
      - uses: actions/checkout@v4
      - name: pffft (FFT backend of the plugin)
        run: git clone --depth 1 https://github.com/marton78/pffft.git "$RUNNER_TEMP/pffft"
      - name: DSP tests (-O2)
        working-directory: fusion-clone/tests
        run: make -j3 PFFFT="$RUNNER_TEMP/pffft" all
      - name: DSP tests (the plugin's optimisation flags)
        working-directory: fusion-clone/tests
        run: |
          make clean
          CXXFLAGS="$PLUGIN_OPT" make -j3 PFFFT="$RUNNER_TEMP/pffft" all
      - name: CPU benchmark (Apple silicon only)
        if: runner.os == 'macOS'
        working-directory: fusion-clone/tools
        run: |
          CXXFLAGS="$PLUGIN_OPT" make PFFFT="$RUNNER_TEMP/pffft" bench
          { echo '## CPU benchmark on '"$(sysctl -n machdep.cpu.brand_string) ($(sysctl -n hw.ncpu) cores, shared GitHub VM), flags: $PLUGIN_OPT"; echo; ./bench 4 md; } | tee -a "$GITHUB_STEP_SUMMARY"
