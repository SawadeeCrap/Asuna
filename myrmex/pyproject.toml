[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myrmex"
version = "0.1.0"
description = "Music-driven procedural creature animation: Hunyuan3D assets -> auto-rig -> behaviour engine -> Blender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
live = ["mido>=1.3", "python-rtmidi>=1.5"]
vcv = ["zstandard>=0.22"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
myrmex = "myrmex.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
